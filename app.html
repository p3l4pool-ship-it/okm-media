<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>おかも</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おかも">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="okm_app_icon_180.png">
<link rel="icon" href="okm_app_icon_180.png">
<style>
:root{--bg:#F3F6F9;--ink:#2E3F50;--sub:#5E7285;--st:0px;--ab:0px}
@media (prefers-color-scheme: dark){:root{--bg:#10161D;--ink:#E6EDF3;--sub:#A3B4C4}}
/* ホーム画面アプリで下にすき間ができる iPhone の挙動への対策：ページを上の余白の分だけ高くする */
html{min-height:calc(100% + env(safe-area-inset-top));background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif}
/* 上下の余白はアプリの背景と同じ色。アプリは上の余白（--st）と下の余白（--ab）のあいだに置く */
#app{position:fixed;left:0;right:0;top:var(--st);width:100%;height:calc(100% - var(--st) - var(--ab));border:0;display:block;background:var(--bg)}
.box{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.box img{width:96px;height:96px;border-radius:22px}
.box h1{font-size:18px;font-weight:500;margin:16px 0 8px}
.box p{font-size:14px;color:var(--sub);line-height:1.8;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="app" hidden title="おかも 添削" allow="clipboard-write"></iframe>
<div class="box" id="box">
  <img src="okm_app_icon_180.png" alt="">
  <h1>おかも 添削</h1>
  <p id="msg">ひらいています…</p>
</div>
<script>
var APP = 'https://script.google.com/macros/s/AKfycbytadBya3DZszG6kxNwN8ieMYw9wof6VkVNUCZH6wGvophQV7JnE9oEU45mVlKOpIwz8A/exec';
var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
// 鍵はリンクの末尾（#k=…）にだけある。このページ自体には書かない
var m = (location.hash + '&' + location.search).match(/[#?&]k=([0-9a-f]{32,128})/);
var k = m ? m[1] : '';
try { if (k) localStorage.setItem('okm_k', k); else k = localStorage.getItem('okm_k') || ''; } catch (e) {}
// ステータスバーの高さ：ホーム画面アプリのときだけ上に帯を敷く（ノッチ無しの端末は 0 が返るので最低 20px）
function inset(side) {
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-' + side + ');width:1px;visibility:hidden';
  document.body.appendChild(probe);
  var h = probe.offsetHeight;
  document.body.removeChild(probe);
  return h;
}
// 高さは「いま実際に描ける範囲」（window.innerHeight）に合わせる。描けない所へはみ出させない
function fit() {
  if (!standalone) return;
  var st = Math.max(inset('top'), 20), sb = inset('bottom');
  var portrait = window.innerHeight >= window.innerWidth;
  // iPhone が画面より短い高さを返している（下に描けない帯がある）ときは、下の余白を足さない
  var gap = portrait ? Math.max(0, (screen.height || 0) - window.innerHeight) : 0;
  var ab = gap > 10 ? 0 : Math.max(sb - 14, 0);
  var root = document.documentElement;
  root.style.setProperty('--st', st + 'px');
  root.style.setProperty('--ab', ab + 'px');
  document.getElementById('app').style.height = (window.innerHeight - st - ab) + 'px';
}
fit(); setTimeout(fit, 300); setTimeout(fit, 1200);
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
if (!k) {
  document.getElementById('msg').innerHTML = 'このページは鍵付きのリンクから開いてください。<br>添削アプリを直接開き、右上の「＋」のボタンから<br>ホーム画面用のリンクを出せます。';
} else {
  var f = document.getElementById('app');
  f.onload = function () { document.getElementById('box').hidden = true; };
  f.src = APP + '?k=' + k;
  f.hidden = false;
  if (!standalone) setTimeout(function () {
    var p = document.getElementById('msg');
    if (p) p.innerHTML = '共有ボタン →「ホーム画面に追加」で<br>アプリとして置けます';
  }, 0);
}
</script>
</body>
</html>
